name: build

# Runs on every push to main, on pull requests, and on version tags.
#
# The supported range is JDK 17 and up. 17 is the baseline the pom enforces;
# 21 is the next LTS and the one most people deploy. Both must stay green.
# JDK 25 runs as a separate preview job so a toolchain regression upstream
# shows up as a warning instead of blocking every merge.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `verify` rather than `test`: it also runs the packaging steps, so a
      # broken sources jar or a missing resource fails here and not at release.
      - name: mvn clean verify
        run: mvn -B -ntp clean verify

      # Surefire reports are the only useful artefact when a test fails.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

  javadoc:
    name: javadoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Central refuses a release whose javadoc fails to build. Catching it
      # here costs 90 seconds; catching it during `mvn deploy` costs a release
      # attempt and a rollback.
      #
      # Installed first so the aggregate run resolves module-to-module
      # references through the local repository instead of a stale SNAPSHOT
      # from somewhere else.
      - name: Install without tests
        run: mvn -B -ntp -DskipTests install

      - name: Aggregate javadoc
        run: mvn -B -ntp -DskipTests javadoc:aggregate

  jdk-next:
    name: test (JDK 25, preview)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: mvn clean verify
        run: mvn -B -ntp clean verify
